name: Deploy to cPanel (FTPS)

# Deploys landing + app only. API is deployed manually (see api/README.md)
# so CI can never overwrite server-side config.php / .htaccess / DB creds.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build landing + app
        run: npm run build

      # Landing → site root. Mirrors mimmycare.com/, so EXCLUDE app/ and api/
      # or the sync would delete those server subfolders.
      - name: Deploy landing → root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./landing/dist/
          server-dir: ./mimmycare.com/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            app/**
            api/**

      # App → mimmycare.com/app/ (isolated subdir, base '/app/' set in vite).
      - name: Deploy app → /app/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./app/dist/
          server-dir: ./mimmycare.com/app/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
